[package]
name = "hp-tree"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Cache-optimized arena-based DOM tree for the HTML parser"
repository = "https://github.com/nicatdcw/fast-html-parser"
keywords = ["html", "dom", "parser", "arena"]
categories = ["parser-implementations"]

[features]
default = ["entity-decode"]
entity-decode = ["hp-tokenizer/entity-decode"]
async-tokio = ["dep:tokio"]
async-async-std = ["dep:async-std"]

[dependencies]
hp-core = { path = "../hp-core" }
hp-encoding = { path = "../hp-encoding" }
hp-tokenizer = { path = "../hp-tokenizer", default-features = false }
thiserror = { workspace = true }
encoding_rs = { workspace = true }
tokio = { workspace = true, features = ["io-util"], optional = true }
async-std = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "io-util"] }

[[bench]]
name = "tree_bench"
harness = false
