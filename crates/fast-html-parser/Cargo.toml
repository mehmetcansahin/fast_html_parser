[package]
name = "fast-html-parser"
version = "0.2.0"
autobenches = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "SIMD-optimized HTML parser for web scraping — fast tokenization, CSS selectors, XPath, encoding detection"
homepage.workspace = true
repository = "https://github.com/mehmetcansahin/fast_html_parser"
documentation = "https://docs.rs/fast-html-parser"
readme = "../../README.md"
keywords = ["html", "parser", "simd", "web-scraping", "css-selector"]
categories = ["parser-implementations", "web-programming"]
exclude = ["benches/", "tests/"]

[features]
default = ["css-selector", "entity-decode", "encoding", "simd"]
css-selector = ["dep:fhp-selector"]
xpath = ["dep:fhp-selector", "css-selector"]
encoding = ["dep:fhp-encoding", "fhp-tree/encoding"]
async-tokio = ["fhp-tree/async-tokio", "encoding"]
async-async-std = ["fhp-tree/async-async-std", "encoding"]
entity-decode = ["fhp-tree/entity-decode", "fhp-tokenizer/entity-decode"]
simd = ["fhp-tokenizer/simd", "fhp-tree/simd"]

[dependencies]
fhp-core = { version = "0.2.0", path = "../fhp-core" }
fhp-tokenizer = { version = "0.2.0", path = "../fhp-tokenizer", default-features = false }
fhp-tree = { version = "0.2.0", path = "../fhp-tree", default-features = false }
fhp-selector = { version = "0.2.0", path = "../fhp-selector", optional = true }
fhp-encoding = { version = "0.2.0", path = "../fhp-encoding", optional = true }

[dev-dependencies]
criterion = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "io-util"] }
tl = "0.7"
scraper = "0.22"
lol_html = "2"
serde_json = "1"

[[bench]]
name = "e2e_bench"
harness = false
required-features = ["encoding"]

[[bench]]
name = "comparison_bench"
harness = false
required-features = ["css-selector", "entity-decode"]

[[bench]]
name = "profile_bench"
harness = false

[[bench]]
name = "realworld_bench"
harness = false
required-features = ["css-selector", "entity-decode"]

[[example]]
name = "basic_parse"

[[example]]
name = "web_scraping"
required-features = ["css-selector"]

[[example]]
name = "streaming"
required-features = ["encoding"]

[[example]]
name = "xpath_query"
required-features = ["xpath"]

[[example]]
name = "encoding"
required-features = ["encoding"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
