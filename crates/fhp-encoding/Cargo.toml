[package]
name = "fhp-encoding"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Encoding detection and conversion for the HTML parser"
homepage.workspace = true
repository = "https://github.com/mehmetcansahin/fast_html_parser"
documentation = "https://docs.rs/fhp-encoding"
keywords = ["encoding", "html", "charset", "utf8", "parser"]
categories = ["encoding"]
exclude = ["benches/", "tests/"]

[dependencies]
fhp-core = { version = "0.2.0", path = "../fhp-core" }
encoding_rs = { workspace = true }
thiserror = { workspace = true }
