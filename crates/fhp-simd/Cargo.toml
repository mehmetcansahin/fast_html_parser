[package]
name = "fhp-simd"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "SIMD abstraction layer with runtime dispatch for the HTML parser"
homepage.workspace = true
repository = "https://github.com/nicatdcw/fast-html-parser"
documentation = "https://docs.rs/fhp-simd"
keywords = ["simd", "html", "parser"]
categories = ["algorithms"]

[dependencies]
fhp-core = { path = "../fhp-core" }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "simd_bench"
harness = false
