[package]
name = "fhp-simd"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "SIMD abstraction layer with runtime dispatch for the HTML parser"
homepage.workspace = true
repository = "https://github.com/mehmetcansahin/fast_html_parser"
documentation = "https://docs.rs/fhp-simd"
keywords = ["simd", "html", "parser", "neon", "avx2"]
categories = ["algorithms"]
exclude = ["benches/", "tests/"]

[features]
default = ["simd"]
simd = []

[dependencies]
fhp-core = { version = "0.2.0", path = "../fhp-core" }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "simd_bench"
harness = false
