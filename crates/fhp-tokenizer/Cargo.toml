[package]
name = "fhp-tokenizer"
version = "0.2.0"
autobenches = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "SIMD-accelerated HTML tokenizer with structural indexing"
homepage.workspace = true
repository = "https://github.com/mehmetcansahin/fast_html_parser"
documentation = "https://docs.rs/fhp-tokenizer"
keywords = ["html", "tokenizer", "simd", "parser", "lexer"]
categories = ["parser-implementations"]
exclude = ["benches/", "tests/"]

[features]
default = ["entity-decode", "simd"]
entity-decode = []
simd = ["fhp-simd/simd"]

[dependencies]
fhp-core = { version = "0.2.0", path = "../fhp-core" }
fhp-simd = { version = "0.2.0", path = "../fhp-simd", default-features = false }
memchr = "2"

[dev-dependencies]
criterion = { workspace = true }
serde_json = "1"
# Tokenizer comparison competitors (benches/tokenizer_comparison_bench.rs).
html5ever = "0.40"
html5gum = "0.8"
lol_html = "2"
tl = "0.7"

[[bench]]
name = "tokenizer_bench"
harness = false

[[bench]]
name = "tokenizer_comparison_bench"
harness = false
required-features = ["entity-decode"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
