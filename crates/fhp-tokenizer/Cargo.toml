[package]
name = "fhp-tokenizer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "SIMD-accelerated HTML tokenizer with structural indexing"
repository = "https://github.com/nicatdcw/fast-html-parser"
keywords = ["html", "tokenizer", "simd"]
categories = ["parser-implementations"]

[features]
default = ["entity-decode"]
entity-decode = []
async-tokio = []
async-async-std = []

[dependencies]
fhp-core = { path = "../fhp-core" }
fhp-simd = { path = "../fhp-simd" }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "tokenizer_bench"
harness = false
