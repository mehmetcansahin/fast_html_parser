[package]
name = "fhp-tokenizer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "SIMD-accelerated HTML tokenizer with structural indexing"
homepage.workspace = true
repository = "https://github.com/nicatdcw/fast-html-parser"
documentation = "https://docs.rs/fhp-tokenizer"
keywords = ["html", "tokenizer", "simd", "parser", "lexer"]
categories = ["parser-implementations"]

[features]
default = ["entity-decode"]
entity-decode = []
async-tokio = []
async-async-std = []

[dependencies]
fhp-core = { version = "0.1", path = "../fhp-core" }
fhp-simd = { version = "0.1", path = "../fhp-simd" }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "tokenizer_bench"
harness = false
