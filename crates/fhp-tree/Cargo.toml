[package]
name = "fhp-tree"
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Cache-optimized arena-based DOM tree for the HTML parser"
homepage.workspace = true
repository = "https://github.com/mehmetcansahin/fast_html_parser"
documentation = "https://docs.rs/fhp-tree"
keywords = ["html", "dom", "parser", "arena", "tree"]
categories = ["parser-implementations"]
exclude = ["benches/", "tests/"]

[features]
default = ["entity-decode", "encoding"]
entity-decode = ["fhp-tokenizer/entity-decode"]
encoding = ["dep:fhp-encoding", "dep:encoding_rs"]
async-tokio = ["dep:tokio", "encoding"]
async-async-std = ["dep:async-std", "encoding"]

[dependencies]
fhp-core = { version = "0.1.2", path = "../fhp-core" }
fhp-encoding = { version = "0.1.2", path = "../fhp-encoding", optional = true }
fhp-tokenizer = { version = "0.1.2", path = "../fhp-tokenizer", default-features = false }
thiserror = { workspace = true }
encoding_rs = { workspace = true, optional = true }
memchr = "2"
tokio = { workspace = true, features = ["io-util"], optional = true }
async-std = { workspace = true, optional = true, features = ["std"] }

[dev-dependencies]
criterion = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "io-util"] }

[[bench]]
name = "tree_bench"
harness = false
