[package]
name = "fhp-selector"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "CSS selector engine for the HTML parser"
homepage.workspace = true
repository = "https://github.com/nicatdcw/fast-html-parser"
documentation = "https://docs.rs/fhp-selector"
keywords = ["css", "selector", "xpath", "html", "parser"]
categories = ["parser-implementations", "web-programming"]

[dependencies]
fhp-core = { version = "0.1", path = "../fhp-core" }
fhp-tree = { version = "0.1", path = "../fhp-tree" }
thiserror = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "selector_bench"
harness = false
