[package]
name = "fhp-selector"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "CSS selector engine for the HTML parser"
homepage.workspace = true
repository = "https://github.com/mehmetcansahin/fast_html_parser"
documentation = "https://docs.rs/fhp-selector"
keywords = ["css", "selector", "xpath", "html", "parser"]
categories = ["parser-implementations", "web-programming"]
exclude = ["benches/", "tests/"]

[dependencies]
fhp-core = { version = "0.2.0", path = "../fhp-core" }
fhp-tree = { version = "0.2.0", path = "../fhp-tree", default-features = false }
thiserror = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "selector_bench"
harness = false

[[bench]]
name = "xpath_bench"
harness = false
