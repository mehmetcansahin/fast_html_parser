[package]
name = "hp-tokenizer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "SIMD-accelerated HTML tokenizer with structural indexing"

[features]
default = []
async-tokio = []
async-async-std = []

[dependencies]
hp-core = { path = "../hp-core" }
hp-simd = { path = "../hp-simd" }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "tokenizer_bench"
harness = false
