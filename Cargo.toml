[workspace]
resolver = "3"
members = [
    "crates/hp-core",
    "crates/hp-simd",
    "crates/hp-tokenizer",
    "crates/hp-tree",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
thiserror = "2"
phf = { version = "0.11", features = ["macros"] }
criterion = { version = "0.5", features = ["html_reports"] }
