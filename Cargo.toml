[workspace]
resolver = "3"
members = [
    "crates/hp-core",
    "crates/hp-simd",
    "crates/hp-tokenizer",
    "crates/hp-tree",
    "crates/hp-selector",
    "crates/hp-encoding",
    "crates/fast-html-parser",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
thiserror = "2"
phf = { version = "0.11", features = ["macros"] }
criterion = { version = "0.5", features = ["html_reports"] }
encoding_rs = "0.8"
tokio = { version = "1", default-features = false }
async-std = { version = "1", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.bench]
lto = true
codegen-units = 1
